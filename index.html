let AC=null,muted=false;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}}
function tone(f,d,type,v,f2){if(!AC||muted)return;try{const t=AC.currentTime;const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v||0.05,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function noise(d,v,fc){if(!AC||muted)return;try{const t=AC.currentTime;const len=Math.max(1,Math.floor(AC.sampleRate*d));const b=AC.createBuffer(1,len,AC.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=fc||800;const gn=AC.createGain();gn.gain.setValueAtTime(v||0.06,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(fl).connect(gn).connect(AC.destination);s.start(t);}catch(e){}}

function mLead(t,f,tr){const o=AC.createOscillator(),gn=AC.createGain(),fl=AC.createBiquadFilter();o.type=tr.lead;o.frequency.setValueAtTime(f,t);fl.type='lowpass';fl.frequency.value=tr.lead==='sawtooth'?2400:3200;env(gn,t,0.004,tr.lv,0.2);o.connect(fl).connect(gn);gn.connect(MUSIC.g);const sd=AC.createGain();sd.gain.value=0.55;gn.connect(sd).connect(MUSIC.dly);o.start(t);o.stop(t+0.3);}

function parseLevel(i){
 const L=LEVELS[i],rows=L.map,h=rows.length,w=rows[0].length;

 let hasX=false;
 for(let r=0;r<h;r++){lv.tiles.push([]);for(let c=0;c<w;c++){const ch=rows[r][c]||'#';let k='=',link=null;
  switch(ch){

function updatePlayer(dt){

  case 'hit':p.vx=approach(p.vx,0,260*dt);if(!supported()){toAir(p.vx);break;}moveGround(dt);if(p.t>0.3){if(nearestFoe(SIGHT,true))setSt('fight');else setSt('stand');}break;
  case 'stand':{p.vx=0;if(!supported()){toAir(0);break;}ground();if(p.st!=='stand')break;

 if(t.boss){SFX.power();shakeT=0.5;hitStop=0.25;sparks(e.x,e.y-36,30,['#ffffff','#ffe040','#ff8020']);if(LV.door){LV.door.opening=true;}msgSet(e.type==='K'?'Mayor Dimsdale is out of office! The door unlocks.':'Thurston Greaves is grounded! The jet door opens.',3.5);return;}

function hitFoe(e,dmg,kb,wn,fin){const t=ET[e.type],p=P;e.engaged=true;const hx=e.x-p.f*6,hy=e.y-(t.small?10:30);

 e.hp-=dmg;e.guard=1.1;e.flash=0.18;SFX.hitE();sparks(hx,hy,fin?14:8,fin?['#ffffff','#ffe040','#ff8020']:['#ffffff','#ffe040']);hitStop=fin?0.12:0.06;shakeT=fin?0.2:0.08;

function throwBottle(e){const p=P,t=ET[e.type],kind=t.proj||'bottle';const dx=p.x-e.x;if(kind==='golf'){LV.ebullets.push({x:e.x+e.f*10,y:e.y-20,vx:Math.sign(dx)*240,vy:-110,r:rowOf(e.y),src:e,life:2.5,kind});tone(1600,0.05,'square',0.04);return;}

function updateFoes(dt){const p=P;const pr=rowOf(p.y);
 for(const e of LV.enemies){const t=ET[e.type];e.t+=dt;if(e.flash>0)e.flash-=dt;if(e.guard>0)e.guard-=dt;
  if(e.st==='dead'){e.deadT+=dt;continue;}
  if(e.st==='fall'){e.vy=Math.min(e.vy+G*dt,520);e.y+=e.vy*dt;e.x+=e.kf*25*dt;const lr=rowOf(e.y);
   if(tile(colOf(e.x),lr).k==='%'&&e.y>lr*TH+40){killFoe(e,'liquid');SFX.land();continue;}
   const rr=Math.floor((e.y+FL)/TH)-1,S=surf(rr);if(e.vy>0&&e.y>=S&&e.y-e.vy*dt<=S+0.5&&standable(colOf(e.x),rr)){e.y=S;SFX.land();if(rr-e.fromRow>=2||e.hp<=0)killFoe(e,'fall');else{e.st='stun';e.t=-0.3;}}
   if(e.y>LV.h*TH+100)killFoe(e,'gone');continue;}
  const er=rowOf(e.y),dx=p.x-e.x,adx=Math.abs(dx);

  const sameRoom=Math.floor(e.x/(RW*TW))===curRoom.rx&&Math.floor(er/RH)===curRoom.ry&&Math.floor(p.x/(RW*TW))===curRoom.rx;
  const sees=p.st!=='dead'&&!hidden&&er===pr&&(sameRoom||e.engaged)&&(e.engaged||T-roomEnterT>0.9)&&adx<(e.engaged?SIGHT+40:SIGHT)&&clearLine(e.x,p.x,er);
  e.cd-=dt;
  if(t.radio&&e.engaged&&!LV.radioed&&e.hp>0&&e.hp<=e.max/2){LV.radioed=true;msgSet('Security: Code purple! Need backup at the hangar!',2.5);tone(1200,0.08,'square',0.03);noise(0.4,0.05,2500);const sx=e.x+(dx>0?-1:1)*110;const m=newFoe('A',colOf(sx),er);if(standable(colOf(sx),er)&&clearLine(e.x,sx,er)){m.x=sx;m.engaged=true;m.st='alert';m.t=0.3;m.hp=3;m.max=3;LV.enemies.push(m);}}
  if(t.boss&&e.engaged&&!e.final2&&e.hp>0&&e.hp<=e.max*0.3){e.final2=true;e.enraged=true;msgSet(t.name+' is furious! Watch out!',2);shakeT=0.3;SFX.howl();}
  if(t.boss&&e.engaged&&!e.summoned&&e.hp<=e.max/2){e.summoned=true;e.enraged=true;msgSet(t.call,2.5);const sx=e.x+(dx>0?-1:1)*96;const m=newFoe(t.minion,colOf(sx),er);if(standable(colOf(sx),er)){m.x=sx;m.engaged=true;m.st='alert';m.t=0.5;LV.enemies.push(m);}}
  if(e.final){if(p.sheathT>0&&p.st!=='fight'&&p.st!=='attack'&&er===pr&&adx<16){mergeShadow(e);continue;}if(p.sheathT>0&&e.st!=='idle'&&e.st!=='alert'){e.st='walk';e.cd=0.5;}}
  const st=tile(colOf(e.x),er);if(st.k==='s'){const sv=LV.steams.find(q=>q.c===colOf(e.x)&&q.r===er);if(sv&&sv.on&&sv.ph>0.1&&e.flash<=0){e.hp-=1;e.flash=0.6;sparks(e.x,e.y-20,6,['#ffffff','#c8c8d0']);if(e.hp<=0){killFoe(e,'steam');continue;}}}
  const move=(v)=>{const nx=e.x+v*dt;const lead=colOf(nx+Math.sign(v)*6);if(!standable(lead,er)||!clearLine(e.x,nx+Math.sign(v)*6,er))return false;
   if(sees&&Math.sign(v)===Math.sign(dx)&&Math.abs(p.x-nx)<(t.small?16:24))return false;e.x=nx;e.anim+=Math.abs(v*dt);return true;};
  switch(e.st){
   case 'idle':
    if(sees){if(!e.engaged){e.engaged=true;e.f=dx>=0?1:-1;e.st='alert';e.t=0;if(t.boss){msgSet(t.taunt,3);SFX.howl();e.t=-1;}else if(t.shadow)SFX.laugh();else if(e.type==='g')SFX.honk();else if(e.type==='b')SFX.bark();else if(e.type==='O')noise(0.35,0.08,3000);else if(e.type==='X')SFX.howl();else if(e.type==='M')SFX.squeak();else msgSet(t.name+'!',1.4);break;}e.st='walk';e.t=0;break;}
    e.engaged=false;
    if(t.small||t.twitchy){if(e.t>1.5){e.t=0;e.f=Math.random()<.5?-1:1;}if(Math.abs(e.x-e.home)<20)move(e.f*14);else e.f=Math.sign(e.home-e.x)||1;}
    break;
   case 'alert':e.f=dx>=0?1:-1;if(!sees){e.st='idle';e.engaged=false;e.t=0;break;}if(e.t>(t.small?0.6:1.0)){e.st='walk';e.t=0;e.cd=0.5;}break;
   case 'walk':{
    if(!sees){e.st='idle';e.t=0;break;}

    else if(e.cd<=0){e.st='wind';e.t=0;if(e.type==='g'&&Math.random()<.5)SFX.honk();}
    break;}
   case 'throw':if(e.t>0.45){throwBottle(e);e.st='recover';e.t=0;}break;

   case 'lunge':{const ok=move(e.f*(t.small?240:200));if(adx<=t.reach||!ok||e.t>0.35){e.st='strike';e.t=0;foeStrike(e);}break;}
   case 'wind':if(e.t>t.wind){e.st='strike';e.t=0;foeStrike(e);}break;
   case 'strike':if(e.t>0.16){if(t.retreat){e.st='retreat';e.t=0;}else{e.st='recover';e.t=0;}}break;
   case 'retreat':move(-e.f*t.speed*0.8);if(e.t>0.35){e.st='walk';e.t=0;e.cd=rnd2(t.cd)*0.6;}break;
   case 'recover':if(e.t>0.25){e.st='walk';e.t=0;e.cd=rnd2(t.cd)*(e.final2?0.7:1);}break;
   case 'block':if(e.t>0.22){if(adx<=t.reach+2&&sees&&Math.random()<0.7){e.st='wind';e.t=t.wind*0.3;}else{e.st='walk';e.t=0;e.cd=Math.min(e.cd,0.2);}}break;
   case 'stun':if(e.t>0.3){e.st='walk';e.t=0;e.cd=0.1+Math.random()*0.35;}break;}}
 for(const b of LV.bullets){const nx=b.x+b.vx*dt;b.life-=dt;
  for(const e of LV.enemies){if(e.st!=='dead'&&e.st!=='fall'&&rowOf(e.y)===b.r&&Math.min(b.x,nx)<=e.x+5&&Math.max(b.x,nx)>=e.x-5){hitFoe(e,WEAP.gun.dmg,WEAP.gun.kb*Math.sign(b.vx),'gun',false);b.life=0;break;}}
  if(tile(colOf(nx),b.r).k==='#'||!clearLine(b.x,nx,b.r)){b.life=0;}
  b.x=nx;}
 LV.bullets=LV.bullets.filter(b=>b.life>0);
 for(const b of LV.ebullets){b.vy+=600*dt;const ny=b.y+b.vy*dt,nx=b.x+b.vx*dt;b.life-=dt;
  if(p.st!=='dead'&&Math.abs(nx-p.x)<9&&ny>p.y-46&&ny<p.y){b.life=0;
   if(p.blocking&&p.st==='fight'&&Math.sign(b.vx)===-p.f){SFX.clang();sparks(nx,ny,6,['#a0e0a0','#ffffff']);}else if(p.inv<=0){if(hurt(1,b.src.type)){hitStop=0.06;shakeT=0.12;}SFX.glass();sparks(nx,ny,8,['#60c060','#c0ffc0']);}}
  const rr=Math.floor((ny+FL)/TH)-1;if(b.vy>0&&ny>=surf(rr)&&b.y<=surf(rr)+1&&standable(colOf(nx),rr)){b.life=0;if(b.kind==='barrel'){LV.puddles.push({x:nx,r:rr,t:4.5});noise(0.3,0.08,600);}else SFX.glass();sparks(nx,surf(rr)-2,8,['#60c060','#c0ffc0']);}
  if(tile(colOf(nx),rowOf(ny)).k==='#')b.life=0;
  b.x=nx;b.y=ny;}
 LV.ebullets=LV.ebullets.filter(b=>b.life>0);}

function roomOf(x,y){return {rx:Math.max(0,Math.min(LV.roomsX-1,Math.floor(x/(RW*TW)))),ry:Math.max(0,Math.min(LV.roomsY-1,Math.floor(y/(RH*TH))))};}
function inRoom(c,r){return Math.floor(c/RW)===curRoom.rx&&Math.floor(r/RH)===curRoom.ry;}

function mergeShadow(e){const p=P;e.st='dead';e.vanish=true;e.deadT=1.5;maxHp=Math.min(10,maxHp+1);p.hp=maxHp;SFX.power();shakeT=0.4;flashT=0.3;sparks(p.x,p.y-26,30,['#8a3ac0','#ffffff','#ffe040']);
 msgSet('You and your shadow are one again. Full health, max health +1. The gate opens!',4);for(const gt of LV.gates){gt.mode='opening';gt.t=-999;}LV.mergeDone=true;}
function updateEvents(dt){const p=P;
 for(const ev of LV.events){if(ev.done)continue;

  else if(ev.type==='steal'){const [rx,ry]=ev.room.split(',').map(Number);if(curRoom.rx===rx&&curRoom.ry===ry){const it=LV.items.find(i=>!i.taken&&(i.type==='W'||i.type==='r')&&Math.floor(i.c/RW)===rx&&Math.floor(i.r/RH)===ry);ev.done=true;

    sparks(e.x,e.y-26,20,['#3a1a5a','#8a3ac0','#000000']);msgSet(ev.type==='final'?'Your shadow blocks the way. You cannot beat yourself.':'Your shadow attacks!',2.5);}}}
 const sh=LV.shade;if(sh){sh.t+=dt;sh.anim+=150*dt;
  if(sh.mode==='steal'){const tx=sh.item.c*TW+16;sh.f=tx>sh.x?1:-1;sh.x+=sh.f*150*dt;if(Math.abs(sh.x-tx)<5){if(!sh.item.taken){sh.item.taken=true;msgSet('The shadow hippo stole your pizza!',2.5);SFX.laugh();}sh.mode='flee';}}
  else{sh.x+=sh.f*160*dt;if(sh.t>3||Math.floor(sh.x/(RW*TW))!==curRoom.rx)LV.shade=null;}}}

function quitToTitle(){mode='title';saved=loadSave();msgT=0;hintT=0;}
function tapAt(x,y){
 if(mode==='paused'){if(x>=220&&x<=420&&y>=292&&y<=330){quitToTitle();return;}mode='play';return;}
 if(mode==='title'){if(x>=40&&x<=300){for(const bt of titleButtons())if(y>=bt.y&&y<=bt.y+bt.h){bt.act();return;}}newGame(false);return;}
 if(mode==='play')return;

function update(dt){musUpdate();
 for(const f of FX){f.vy+=300*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;}for(let i=FX.length-1;i>=0;i--)if(FX[i].life<=0)FX.splice(i,1);if(shakeT>0)shakeT-=dt;

 if(pressed.mute){muted=!muted;msgSet(muted?'Sound off.':'Sound on.',1.5);}
 const go=pressed.act||pressed.enter;
 switch(mode){
  case 'title':if(pressed.victory){if(!RANKS.length)RANKS=['A','S','B','A','A','B','S','A','B','A','S','A'];mode='ending';cardT=0;END=null;break;}if(pressed.cont&&saved)continueGame();else if(pressed.arena)startArena();else if(pressed.hard)newGame(true);else if(go||pressed.new)newGame(false);break;
  case 'intro':cardT+=dt;if(go&&cardT>0.3)startLevel(0);break;
  case 'story':cardT+=dt;if(go&&cardT>0.5){mode='card';cardT=0;}break;
  case 'results':cardT+=dt;if(go&&cardT>1.2)afterResults();break;
  case 'card':cardT+=dt;if(cardT>2.4||(go&&cardT>0.3))beginPlay();break;
  case 'play':
   if(pressed.pause){mode='paused';break;}
   if(!LEVELS[li].practice)gameTime-=dt;if(gameTime<=0){gameTime=0;mode='timeup';clearSave();saved=null;SFX.die();break;}
   if(hitStop>0){hitStop-=dt;break;}
   if(P.st!=='climb'&&P.st!=='climbDown')curRoom=roomOf(P.x,P.y-24);
   {const rk=curRoom.rx+','+curRoom.ry;if(rk!==lastRoomKey){lastRoomKey=rk;roomEnterT=T;}}
   updateWorld(dt);if(mode!=='play')break;updatePlayer(dt);break;
  case 'paused':if(pressed.swap)quitToTitle();else if(pressed.pause||go)mode='play';break;
  case 'dead':if(!LEVELS[li].practice)gameTime-=dt;if(gameTime<=0){gameTime=0;mode='timeup';clearSave();saved=null;break;}
   updateWorld(dt);P.deadT+=dt;if(P.deadT>1.2&&(go||pressed.up))retryLevel();break;
  case 'ending':cardT+=dt;if(go&&cardT>0.5){if(cardT<7)cardT=7.3;else{mode='title';saved=loadSave();}}break;
  case 'timeup':case 'roundend':cardT+=dt;if(go&&cardT>1)mode='title',saved=loadSave();break;}}
