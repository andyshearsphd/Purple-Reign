let AC=null,muted=false;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}}
function tone(f,d,type,v,f2){if(!AC||muted)return;try{const t=AC.currentTime;const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(v||0.05,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function noise(d,v,fc){if(!AC||muted)return;try{const t=AC.currentTime;const len=Math.max(1,Math.floor(AC.sampleRate*d));const b=AC.createBuffer(1,len,AC.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=fc||800;const gn=AC.createGain();gn.gain.setValueAtTime(v||0.06,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(fl).connect(gn).connect(AC.destination);s.start(t);}catch(e){}}

function mfreq(m){return 440*Math.pow(2,(m-69)/12);}
function chordOf(tr,deg){const sc=SCALES[tr.sc],out=[];for(let i=0;i<5;i++){const d=deg+i*2,o=Math.floor(d/7);out.push(tr.root+sc[d%7]+12*o);}return out;}
function musInit(){if(MUSIC.g||!AC)return;try{
 MUSIC.g=AC.createGain();MUSIC.g.gain.value=muted?0:MUSIC.vol;MUSIC.g.connect(AC.destination);
 const d=AC.createDelay(1.0);d.delayTime.value=0.33;const fb=AC.createGain();fb.gain.value=0.32;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
 d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(MUSIC.g);MUSIC.dly=d;
 const len=AC.sampleRate;const b=AC.createBuffer(1,len,AC.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;MUSIC.nb=b;
 MUSIC.timer=setInterval(musTick,25);}catch(e){MUSIC.g=null;}}
function env(gn,t,a,peak,dec){gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(peak,t+a);gn.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function mKick(t,v){const o=AC.createOscillator(),gn=AC.createGain();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);env(gn,t,0.002,0.9*v,0.28);o.connect(gn).connect(MUSIC.g);o.start(t);o.stop(t+0.35);}
function mNoise(t,type,fc,q,peak,dec,dest){const s=AC.createBufferSource();s.buffer=MUSIC.nb;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=fc;f.Q.value=q;const gn=AC.createGain();env(gn,t,0.001,peak,dec);s.connect(f).connect(gn).connect(dest||MUSIC.g);s.start(t,Math.random()*0.5);s.stop(t+dec+0.05);}
function mSnare(t,tr){if(tr.brush){mNoise(t,'bandpass',3000,0.7,0.18,0.22);return;}mNoise(t,'bandpass',1800,0.8,tr.crunch?0.55:0.42,0.16);const o=AC.createOscillator(),gn=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(190,t);env(gn,t,0.001,0.25,0.08);o.connect(gn).connect(MUSIC.g);o.start(t);o.stop(t+0.12);}
function mHat(t,open,v){mNoise(t,'highpass',7000,0.5,0.11*v,open?0.18:0.035);}
function mBass(t,f,dur,tr){const o=AC.createOscillator(),fl=AC.createBiquadFilter(),gn=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t);fl.type='lowpass';fl.Q.value=tr.crunch?9:6;fl.frequency.setValueAtTime(tr.bpm>115?1300:900,t);fl.frequency.exponentialRampToValueAtTime(220,t+dur);env(gn,t,0.005,0.34,dur);o.connect(fl).connect(gn).connect(MUSIC.g);o.start(t);o.stop(t+dur+0.05);}
function mPad(t,notes,dur){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1100;const gn=AC.createGain();gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(0.05,t+0.5);gn.gain.setValueAtTime(0.05,t+dur-0.4);gn.gain.linearRampToValueAtTime(0.0001,t+dur);fl.connect(gn).connect(MUSIC.g);
 notes.slice(0,4).forEach((m,i)=>{[-6,6].forEach(dt=>{const o=AC.createOscillator();o.type=i===0?'triangle':'sawtooth';o.frequency.value=mfreq(m+12);o.detune.value=dt;const og=AC.createGain();og.gain.value=i===0?0.6:0.22;o.connect(og).connect(fl);o.start(t);o.stop(t+dur+0.05);});});}
function mLead(t,f,tr){const o=AC.createOscillator(),gn=AC.createGain(),fl=AC.createBiquadFilter();o.type=tr.lead;o.frequency.setValueAtTime(f,t);fl.type='lowpass';fl.frequency.value=tr.lead==='sawtooth'?2400:3200;env(gn,t,0.004,tr.lv,0.2);o.connect(fl).connect(gn);gn.connect(MUSIC.g);const sd=AC.createGain();sd.gain.value=0.55;gn.connect(sd).connect(MUSIC.dly);o.start(t);o.stop(t+0.3);}
function playStep(tr,s,t){const sd=60/tr.bpm/4,bar=Math.floor(s/16)%tr.prog.length,i=s%16,ch=chordOf(tr,tr.prog[bar]);
 if(tr.kick[i]==='x')mKick(t,1);if(tr.snr[i]==='x')mSnare(t,tr);if(tr.hat[i]==='x')mHat(t,i%8===6&&tr.bpm<100,i%4===0?1:0.6);
 const b=tr.bass[i];if(b&&b!=='.'){const m=b==='R'?ch[0]:b==='T'?ch[1]:b==='F'?ch[2]:ch[0]+12;let L=1;while(i+L<16&&tr.bass[i+L]==='.'&&L<4)L++;mBass(t,mfreq(m-12),sd*L*0.95,tr);}
 const a=tr.arp[i];if(a&&a!=='.'){const n=+a;mLead(t,mfreq((n<4?ch[n]:ch[0]+12)+12),tr);}
 if(tr.pad&&i===0)mPad(t,ch,sd*16);}
function musTick(){if(!AC||!MUSIC.g)return;const now=AC.currentTime;
 if(MUSIC.want!==MUSIC.track){MUSIC.track=MUSIC.want;MUSIC.step=0;MUSIC.nextT=now+0.08;}
 const tr=TRACKS[MUSIC.track];if(!tr||muted)return;if(MUSIC.nextT<now-0.2)MUSIC.nextT=now+0.05;
 while(MUSIC.nextT<now+0.15){const sd=60/tr.bpm/4,sw=(MUSIC.step%2?-1:1)*tr.sw*sd;playStep(tr,MUSIC.step,MUSIC.nextT+(MUSIC.step%2?tr.sw*sd:0));MUSIC.nextT+=sd;MUSIC.step++;}}
function musUpdate(){if(!AC)return;if(!MUSIC.g)musInit();if(!MUSIC.g)return;let w=null;
 if(mode==='title'||mode==='intro'||mode==='story')w='title';
 else if(mode==='card'||mode==='play'||mode==='paused'){const b=LV&&LV.boss;w=(b&&b.engaged&&b.st!=='dead'&&mode!=='card')?'boss':(LV?THEME_MUS[LV.theme]||'street':'street');}
 else if(mode==='ending'||mode==='roundend'||mode==='results')w='ending';
 MUSIC.want=w;const target=muted||!w?0:MUSIC.vol*(mode==='paused'?0.4:1);const gg=MUSIC.g.gain;if(Math.abs(gg.value-target)>0.002)gg.setTargetAtTime(target,AC.currentTime,0.08);}

function pushPlayer(dx){const p=P;if(['air','hang','climb','climbDown','exit','dead','jumpUp'].includes(p.st))return;
 const nx=collideX(p.x,p.x+dx,p.y);p.x=nx;if(!supported())toAir(dx>0?20:-20);}
function playerRowFeet(){return rowOf(P.y);}
function updateSet(dt){const p=P,pc=colOf(p.x),pr=rowOf(p.y),alive=p.st!=='dead';
 for(const s of LV.set){s.t=(s.t||0)+dt;
  if(s.type==='mover'){const M=MOVER[s.kind],hw=M.w/2;
   const inT=alive&&pr===s.row&&pc>=s.tc0&&pc<=s.tc1;
   if(!s.st){s.st='idle';s.dir=s.b>s.a?1:-1;}
   if(s.st==='idle'||s.st==='wait'){if(inT&&T-roomEnterT>1.2&&(s.st==='idle'||s.t>s.every)){s.st='warn';s.t=0;s.x=s.a*TW+16;s.alpha=0;s.hitPass=false;
     if(s.kind==='cop')SFX.siren();else if(s.kind==='boxcar'||s.kind==='loco')SFX.horn();else SFX.beep();if(s.msg&&!s.saidMsg){msgSet(s.msg,3);s.saidMsg=s.every>0;}}}
   else if(s.st==='warn'){if(s.t>Math.max(2.4,s.warn||0)){s.st='go';s.t=0;if(s.kind==='truck'||s.kind==='tug'||s.kind==='forklift')SFX.engine();}}
   else if(s.st==='go'){const end=s.b*TW+16;s.x+=s.dir*M.speed*(s.spd||1)*dt;s.alpha=Math.min(1,s.alpha+dt*4);
    const near=Math.abs(end-s.x)<70&&!s.plunge;if(near)s.alpha=Math.max(0,Math.min(s.alpha,Math.abs(end-s.x)/70));
    const S=surf(s.row);
    if(alive&&!s.hitPass&&p.inv<=0&&pr===s.row&&Math.abs(p.x-s.x)<hw+HW&&p.y>S-M.h+8&&!['hang','climb','climbDown'].includes(p.st)){
     if(s.dmg==='kill'){DEATH['mv_'+s.kind]=M.death;die('mv_'+s.kind);shakeT=0.4;}
     else{s.hitPass=true;DEATH['mv_'+s.kind]=M.death;if(hurt(s.dmg,'mv_'+s.kind)){shakeT=0.25;msgSet(s.hit||('Hit by the '+M.name+'!'),2);if(p.st!=='air'){setSt('stumble');}p.vx=s.dir*80;}}}
    if(!s.nokill)for(const e of LV.enemies){if(e.st==='dead'||e.boss||ET[e.type].shadow)continue;if(rowOf(e.y)===s.row&&Math.abs(e.x-s.x)<hw+6){killFoe(e,'mover');sparks(e.x,e.y-20,12,['#ffffff','#ff4040','#ffe060']);if(inRoom(colOf(e.x),s.row))msgSet('Flattened! Out cold.',1.2);}}
    if((s.dir>0&&s.x>=end)||(s.dir<0&&s.x<=end)){
     if(s.plunge){s.st='fall';s.t=0;s.vy=0;s.rot=0;}
     else if(s.every>0){s.st='wait';s.t=0;if(s.alt){const a=s.a;s.a=s.b;s.b=a;s.dir=-s.dir;}}else s.st='done';}}
   else if(s.st==='fall'){s.vy+=G*dt;s.x+=s.dir*90*dt;s.fy=(s.fy||0)+s.vy*dt;s.rot+=dt*2.2*s.dir;
    if(s.fy>TH*1.4){s.st='done';shakeT=0.6;SFX.crash();sparks(s.x,surf(s.row)+40,40,['#ffe060','#ff8020','#ffffff','#806040']);msgSet(s.crash||'CRASH!',2);}}}
  else if(s.type==='flood'){if(s.top===undefined){s.top=s.y0;s.out=0;s.on=false;}
   const inZ=alive&&pc>=s.c0&&pc<=s.c1&&pr>=s.zr;
   if(!s.on&&alive&&pc>=s.tc0&&pc<=s.tc1&&pr>=s.tr){s.on=true;SFX.rumble();msgSet(s.msg,3.5);}
   if(s.on){if(inZ){s.out=0;s.top=Math.max(s.cap,s.top-s.rise*dt);}else{s.out+=dt;if(s.out>3)s.top=Math.min(s.y0,s.top+10*dt);}
    if(Math.floor(s.t*1.2)!==Math.floor((s.t-dt)*1.2)&&inZ)SFX.bubble();
    if(alive&&pc>=s.c0&&pc<=s.c1&&p.y-26>s.top){DEATH.flood=s.death;die('flood');}
    for(const e of LV.enemies){if(e.st==='dead'||e.boss||ET[e.type].shadow||e.type==='M')continue;const ec=colOf(e.x);if(ec>=s.c0&&ec<=s.c1&&e.y-26>s.top){killFoe(e,'liquid');}}}}
  else if(s.type==='collapse'){if(!s.go){const t=tile(s.pc,s.pr);if(t.press>0){s.go=true;s.t=0;s.i=0;SFX.rumble();shakeT=0.5;msgSet(s.msg,3);
     for(const gt of LV.gates)if(gt.link===s.gate){if(gt.mode!=='open')gt.mode='opening';gt.keep=true;}}}
   else{for(const gt of LV.gates)if(gt.keep&&gt.mode==='open')gt.t=0;
    while(s.i<s.cols.length&&s.t>s.delay+s.i*s.every){const c=s.cols[s.i++],t=tile(c,s.r);if(t.k!=='#'&&t.k!=='.'&&t.k!=='%'&&t.k!=='g'&&t.k!=='D'){t.k='~';t.shake=0.001;LV.loose.push({c,r:s.r});}shakeT=Math.max(shakeT,0.15);}}}
  else if(s.type==='storm'){const inZ=alive&&pc>=s.c0&&pc<=s.c1&&pr>=s.r0&&pr<=s.r1;s.warns=s.warns||[];
   if(inZ){if(!s.said){s.said=true;msgSet(s.msg,3);SFX.rumble();shakeT=0.3;s.next=1.2;}s.next-=dt;
    if(s.next<=0){s.next=s.rate[0]+Math.random()*(s.rate[1]-s.rate[0]);const off=[-1,0,0,1,p.f*2,p.f][Math.floor(Math.random()*6)];const c=Math.max(s.c0,Math.min(s.c1,pc+off));
     if(!s.warns.some(w=>w.c===c))s.warns.push({c,t:s.kind==='chand'?0.9:0.7,y:Math.floor(pr/RH)*RH*TH+2});}}
   for(const w of s.warns){w.t-=dt;if(w.t<=0){w.done=true;LV.debris.push({c:w.c,y:w.y+8,vy:0,hitP:false,done:false,kind:s.kind});if(inRoom(w.c,pr))(s.kind==='chand'?SFX.glass:SFX.crumble)();}}
   s.warns=s.warns.filter(w=>!w.done);}
  else if(s.type==='chase'){updateChase(s,dt);}
  else if(s.type==='crane'||s.type==='ball'||s.type==='wire'||s.type==='press'){updateObst(s,dt);}
  else if(s.type==='wind'){const cyc=s.warn+s.on+s.off,ph=s.t%cyc,inZ=alive&&pr===s.row&&pc>=s.c0&&pc<=s.c1;
   const st=ph<s.off?'off':ph<s.off+s.warn?'warn':'on';if(st!==s.ph){s.ph=st;if(inZ){if(st==='warn')SFX.whine();if(st==='on')SFX.blast();}if(st==='warn'&&inZ&&!s.said){s.said=true;msgSet(s.msg,3.5);}}
   if(st==='on'&&inZ){const brace=p.st==='crouch';pushPlayer(s.dir*s.push*(brace?0.12:1)*dt);}}}}
function conveyorPush(dt){const p=P;if(p.st==='dead')return;const t=tile(colOf(p.x),rowOf(p.y));if(t.conv&&supported()&&!['air','hang','climb','climbDown','jumpUp','exit'].includes(p.st))pushPlayer(t.conv*32*dt);}

function obstHit(kind,msgTxt,dir){DEATH['ob_'+kind]=OB_KO[kind];if(hurt(1,'ob_'+kind)){msgSet(msgTxt,1.8);shakeT=0.2;if(P.st!=='air'&&P.st!=='hang'&&P.st!=='climb'){setSt('stumble');P.vx=(dir||P.f)*70;}}}
const OB_KO={crate:'Flattened by a falling crate.',ball:'Flattened by a wrecking ball.',wire:'Zapped by a live wire.',press:'Stamped flat by a jar press.',scaff:'Buried under falling scaffolding.'};
function updateObst(s,dt){const p=P,pc=colOf(p.x),pr=rowOf(p.y),alive=p.st!=='dead';s.t=(s.t||0);
 if(s.type==='crane'){const ry=Math.floor(s.row/RH),top=ry*RH*TH+10;if(s.tx===undefined){s.tx=(s.c0+s.c1)/2*TW+16;s.st='idle';s.cool=1;}
  const inZ=alive&&pr===s.row&&pc>=s.c0&&pc<=s.c1;
  if(s.st==='idle'){if(inZ){if(!s.said){s.said=true;msgSet(s.msg,3);}s.cool-=dt;if(s.cool<=0){s.st='move';s.target=Math.max(s.c0,Math.min(s.c1,pc+(Math.random()<0.5?0:p.f)))*TW+16;}}}
  else if(s.st==='move'){const d=s.target-s.tx;s.tx+=Math.sign(d)*Math.min(Math.abs(d),150*dt);if(Math.abs(d)<1){s.st='hold';s.ht=0;tone(180,0.3,'square',0.03,120);}}
  else if(s.st==='hold'){s.ht+=dt;if(s.ht>1.0){s.st='drop';s.cy=top+24;s.vy=0;}}
  else if(s.st==='drop'){s.vy+=G*dt;const ny=s.cy+s.vy*dt,S=surf(s.row);const c=colOf(s.tx);
   if(alive&&pr===s.row&&Math.abs(p.x-s.tx)<14+HW&&s.cy<p.y-20&&ny+10>=p.y-44&&!s.hitP){s.hitP=true;obstHit('crate','A crate! Watch for the shadow on the floor.',p.x<s.tx?-1:1);}
   for(const e of LV.enemies){if(e.st==='dead'||e.boss||ET[e.type].shadow)continue;if(rowOf(e.y)===s.row&&Math.abs(e.x-s.tx)<18&&ny+10>=e.y-40)killFoe(e,'debris');}
   s.cy=ny;if(s.cy+10>=S){s.st='idle';s.cool=s.rate;s.hitP=false;shakeT=Math.max(shakeT,0.15);if(inRoom(c,s.row)){noise(0.3,0.12,500);sparks(s.tx,S-8,14,['#a07a4a','#c8a070','#6a4a2a']);}}}}
 else if(s.type==='ball'){const S=surf(s.row),len=s.len,ph=(s.t*2*Math.PI/s.period),a=s.amp*Math.sin(ph),px=s.pc*TW+16,py=S-44-len;s.bx=px+Math.sin(a)*len;s.by=py+Math.cos(a)*len;s.vdir=Math.cos(ph)>0?1:-1;
  const inZ=alive&&pr===s.row&&Math.abs(p.x-px)<len*1.2;if(inZ&&!s.said){s.said=true;msgSet(s.msg,3.5);}
  if(inZ&&p.st!=='crouch'&&p.inv<=0&&Math.hypot(p.x-s.bx,(p.y-30)-s.by)<24)obstHit('ball','Wrecking ball! Hold DOWN to duck under it.',s.vdir);
  for(const e of LV.enemies){if(e.st==='dead'||e.boss||ET[e.type].shadow)continue;if(rowOf(e.y)===s.row&&Math.hypot(e.x-s.bx,(e.y-30)-s.by)<22){killFoe(e,'mover');sparks(e.x,e.y-30,12,['#ffffff','#ffe060']);}}
  if(Math.abs(Math.sin(ph))<0.04&&inRoom(s.pc,s.row)&&(!s.wt||s.t-s.wt>0.5)){s.wt=s.t;noise(0.25,0.04,300);}}
 else if(s.type==='wire'){const cyc=s.off+s.warn+s.on,ph=s.t%cyc;s.ph=ph<s.off?'off':ph<s.off+s.warn?'warn':'on';
  const inZ=alive&&pr===s.row&&pc>=s.c0&&pc<=s.c1;if(alive&&pr===s.row&&Math.abs(pc-(s.c0+s.c1)/2)<5&&!s.said){s.said=true;msgSet(s.msg,3);}

function newGame(hard){HARD=!!hard;li=0;gameTime=HARD?2700:3600;maxHp=5;weapons={};cur='fists';ammo=0;SCORE=0;RANKS=[];mode='intro';cardT=0;}
function startArena(){HARD=false;const i=LEVELS.findIndex(l=>l.practice);gameTime=3600;maxHp=5;weapons={};cur='fists';ammo=0;startLevel(i);}
function continueGame(){const s=loadSave();if(!s){newGame();return;}gameTime=s.gameTime;maxHp=s.maxHp||3;weapons=s.weapons||{};delete weapons.gun;HARD=!!s.hard;SCORE=s.score||0;RANKS=s.ranks||[];cur=s.cur&&s.cur!=='gun'?s.cur:'fists';ammo=s.ammo||0;startLevel(s.li);}
function startLevel(i){li=i;startState={maxHp,weapons:Object.assign({},weapons),cur,ammo};saveGame();saved=loadSave();storyLi=i;mode=LEVELS[i].practice?'card':'story';cardT=0;}
function loadLevel(i){scaleFoes(i);LV=parseLevel(i);P=newPlayer(LV.start);visited={};hintT=0;msgT=0;curRoom=roomOf(P.x,P.y-24);D=null;if(LEVELS[i].drive){LV.drive=true;initDrive();}}
function beginPlay(){loadLevel(li);CHECK=null;LS=newLS();mode='play';}
function retryLevel(){if(CHECK&&CHECK.li===li&&LS){retryCheck();return;}maxHp=startState.maxHp;weapons=Object.assign({},startState.weapons);cur=startState.cur;ammo=startState.ammo;loadLevel(li);const t0=LS?LS.t0:gameTime;if(LS)SCORE=LS.score0;LS=newLS();LS.t0=t0;mode='play';}
function completeLevel(){if(LEVELS[li].practice){mode='title';saved=loadSave();return;}computeResults();mode='results';cardT=0;SFX.power();}
function afterResults(){if(li+1<MAINLEVELS)startLevel(li+1);else{mode='ending';cardT=0;clearSave();saved=null;SFX.power();}}

/* ================= PLAYER ================= */
let hitWall=false;
function setSt(s){P.st=s;P.t=0;}
function supported(){return standable(colOf(P.x),rowOf(P.y));}
function toAir(vx){const p=P;p.fromRow=rowOf(p.y);p.st='air';p.t=0;p.vx=vx;p.vy=0;p.apexY=p.y;p.hop=false;}
function collideX(x,nx,y){hitWall=false;if(nx===x)return nx;const r1=rowOf(y-BODY+2),r2=rowOf(y-1);
 if(nx>x){const c=colOf(nx+HW);for(let r=r1;r<=r2;r++)if(tile(c,r).k==='#'){const lim=c*TW-HW-0.01;if(nx>lim){nx=lim;hitWall=true;}}
  for(const gt of LV.gates){if(gt.open<0.75&&gt.r>=r1&&gt.r<=r2){const gx=(gt.c+1)*TW-4;if(x+HW<=gx+0.5&&nx+HW>gx){nx=gx-HW-0.01;hitWall=true;}}}}
 else{const c=colOf(nx-HW);for(let r=r1;r<=r2;r++)if(tile(c,r).k==='#'){const lim=(c+1)*TW+HW+0.01;if(nx<lim){nx=lim;hitWall=true;}}
  for(const gt of LV.gates){if(gt.open<0.75&&gt.r>=r1&&gt.r<=r2){const gx=(gt.c+1)*TW-4;if(x-HW>=gx-0.5&&nx-HW<gx){nx=gx+HW+0.01;hitWall=true;}}}}
 return nx;}
function moveGround(dt){const p=P;const nx=collideX(p.x,p.x+p.vx*dt,p.y);if(hitWall){p.vx=0;if(p.st==='run'){SFX.bump();setSt('stop');}}p.anim+=Math.abs(nx-p.x);p.x=nx;}
function edgeAhead(){const p=P,c=colOf(p.x),r=rowOf(p.y),f=p.f;for(let k=1;k<=2;k++){const cc=c+k*f;if(tile(cc,r).k==='#')return null;if(!standable(cc,r))return f>0?cc*TW:(cc+1)*TW;}return null;}
function runJump(){const p=P;p.fromRow=rowOf(p.y);p.pj=false;p.st='air';p.t=0;p.vx=p.f*RJX;p.vy=RJY;p.apexY=p.y;p.hop=false;p.upLock=true;SFX.jump();}
function standJump(){const p=P;p.fromRow=rowOf(p.y);p.st='air';p.t=0;p.vx=p.f*SJX;p.vy=SJY;p.apexY=p.y;p.hop=false;p.upLock=true;SFX.jump();}
function grabDir(){const p=P,c=colOf(p.x),r=rowOf(p.y);if(tile(c,r-1).k!=='.')return 0;
 for(const d of [p.f,-p.f]){if(standable(c+d,r-1)&&tile(c+d,r-1).k!=='#')return d;}return 0;}
function jumpUp(hopIfNone){const p=P,c=colOf(p.x),r=rowOf(p.y);p.upLock=true;const d=grabDir();
 if(d){p.f=d;p.gc=c+d;p.gr=r-1;p.gd=d;setSt('jumpUp');SFX.jump();}
 else if(hopIfNone){p.fromRow=rowOf(p.y);setSt('air');p.vx=0;p.vy=JUY;p.apexY=p.y;p.hop=true;SFX.jump();}}
function hangAt(lc,lr,d){const p=P;p.f=d;const ex=d>0?lc*TW:(lc+1)*TW;p.x=ex-d*7;p.y=surf(lr)+HANG;p.hc=lc;p.hr=lr;p.vx=0;p.vy=0;setSt('hang');SFX.grab();}
function climbDown(){const p=P,c=colOf(p.x),r=rowOf(p.y);
 for(const d of [-p.f,p.f]){const nc=c+d,ex=d>0?(c+1)*TW:c*TW;
  if(Math.abs(p.x-ex)<18&&!standable(nc,r)&&tile(nc,r).k!=='#'&&tile(nc,r+1).k!=='#'){p.tx=ex+d*7;p.ty=surf(r)+HANG;p.tf=-d;p.hc=c;p.hr=r;p.cx0=p.x;p.cy0=p.y;setSt('climbDown');return true;}}
 return false;}
function tryGrab(y0,y1,nx){const p=P,h0=y0-HANG,h1=y1-HANG,rr=Math.floor((h1+FL)/TH)-1,Ls=surf(rr);
 if(!(h0<=Ls&&h1>=Ls))return false;const c=colOf(nx);
  {const d=p.f;const ex=d>0?(c+1)*TW:c*TW;
  if(Math.abs(nx-ex)<18&&standable(c+d,rr)&&tile(c+d,rr).k!=='#'&&!standable(c,rr)&&tile(c,rr).k!=='#'&&tile(c,rr+1).k!=='#'){hangAt(c+d,rr,d);return true;}}
 return false;}
function atDoor(){const d=LV.door,p=P;return d&&d.open>=1&&colOf(p.x)===d.c&&rowOf(p.y)===d.r;}
function toExit(){const p=P;setSt('exit');p.dx=LV.door.c*TW+16;p.f=p.dx>=p.x?1:-1;SFX.door();}
function tryEat(){const p=P,c=colOf(p.x),r=rowOf(p.y);const it=LV.items.find(i=>!i.taken&&i.c===c&&i.r===r&&'rtWB'.includes(i.type));if(!it)return false;p.item=it;setSt('eat');return true;}
function applyItem(it){const p=P;if(!it||it.taken)return;it.taken=true;
 switch(it.type){
  case 'J':{if(LS){LS.jars++;LS.jarGot.push(LV.items.indexOf(it));}SFX.jar();addScore(500,it.c*TW+16,surf(it.r)-30,'BALL JAR','#80c8ff');msgSet('A vintage Ball jar! '+(LS?LS.jars:1)+' of '+(LS?LS.jarsTot:3)+' in this level.',2.5);break;}
  case 'r':p.hp=Math.min(maxHp,p.hp+1);SFX.eat();addScore(50);msgSet('Royal Pizza square slice. +1 health.');break;
  case 'W':p.hp=HARD?Math.min(maxHp,p.hp+3):maxHp;SFX.power();addScore(100);msgSet(HARD?'A whole Royal Pizza! +3 health.':'A whole Royal Pizza! Full health.');break;
  case 'B':maxHp=Math.min(10,maxHp+1);p.hp=maxHp;SFX.power();addScore(250,it.c*TW+16,surf(it.r)-30,'XL BOX');msgSet('Extra-large Royal Pizza! Max health +1.');break;
  case 'k':weapons.knife=true;cur='knife';SFX.knife();msgSet('You found a KNIFE! Key 1 selects it.',3);break;
  case 'v':weapons.bat=true;cur='bat';SFX.knife();msgSet('A BASEBALL BAT! Slow, strong, hard to block. Key 2.',3.5);break;
  case 'w':weapons.whip=true;cur='whip';SFX.knife();msgSet('A WHIP! Long reach. Key 3.',3);break;
  case 'n':weapons.gun=true;cur='gun';ammo+=6;SFX.knife();msgSet('A GUN with 6 bullets! Key 4. Make them count.',3.5);break;
  case 'a':ammo+=5;SFX.eat();msgSet('A box of bullets. +5 ammo.',2.5);break;
  case 't':SFX.bad();msgSet('Triangle slices? That is not Royal Pizza. -1 health.');if(hurt(1,'food'))setSt('stumble');break;}}
function hurt(n,kind){const p=P;if(p.inv>0&&kind!=='fall'&&kind!=='food')return true;p.hp-=n;if(LS)LS.hits+=n;p.inv=1.0;flashT=0.18;SFX.hurt();if(p.hp<=0){p.hp=0;die(kind);return false;}return true;}
const DEATH={crash:'Wrapped the Fiero around a station wagon. Out cold.',limo:'Run into the curb by a stretch limo. Out cold.',dpothole:'Hit a Walnut Street pothole at sixty. Out cold.',thrown_briefcase:'Beaned by a flying briefcase. Out cold.',thrown_box:'Buried in shredder-proof paperwork. Out cold.',thrown_bottle:'Clocked by a champagne bottle. Out cold.',escape:'Greaves made it to the airport gate. Walnut Street, one more time.',fall:'Took a bad fall and conked out.',pothole:'Knocked silly by a Muncie pothole.',steam:'Steamed like a dumpling. Out cold.',food:'Floored by a triangle slice. Should have gone to Royal.',debris:'Bonked by falling boards.',roof:'Bonked by a chunk of the Delco roof.',scaff:'Buried under falling scaffolding.',chand:'Bonked by a City Hall chandelier.',flood:'Fished out of the water, out cold.',R:'Whupped by a redneck.',c:'Beaten down by a crooked cop.',y:'Clobbered with a briefcase.',z:'Worn down by City Hall.',g:'Flogged senseless by a mutant goose.',Y:'Pelted senseless by a mutant squirrel.',N:'Clobbered with a trash can lid by a mutant raccoon.',l:'Keyed into next week by a slimy slumlord.',O:'Shredded by a mutant alley cat.',A:'Flashlighted into next week by airport security.',F:'Clubbed by Mr. Kitselman of Indiana Steel and Wire.',toxic:'Overcome by Indiana Steel and Wire chemicals.',j:'Knocked cold by a strung-out druggie.',self:'Beaten by your own shadow.',K:'Gaveled into next week by Mayor Dimsdale.',G:'Driven off the course by Thurston Greaves.',S:'Swallowed up by your own shadow.',spikes:'Snagged on rebar at the bottom of a crater. Out cold.',X:'Mauled senseless by a werewolf. In Muncie.',M:'Mauled by a mutant muskrat.',b:'Knocked flat by a mutant pit bull.'};
function die(kind){const p=P;koPen=0;koTitle=kind==='escape'?'HE GOT AWAY':'KNOCKED OUT';if(LEVELS[li]&&!LEVELS[li].practice){koPen=HARD?180:120;gameTime=Math.max(0,gameTime-koPen);}setSt('dead');p.vx=0;p.vy=0;p.deadT=0;mode='dead';const th=THEME[LV.theme]||THEME.rail;deathText=kind==='pothole'?th.hazD:kind==='steam'?th.stD:kind==='liquid'?th.liqD:(DEATH[kind]||'The hippo has fallen.');SFX.die();}
function landed(lr){const p=P;p.vx=0;SFX.land();const n=lr-(p.fromRow===undefined?lr:p.fromRow);
 if(n>=3){p.hp=0;die('fall');return;}
 setSt('land');
 if(n===2){p.landDur=0.45;if(!hurt(1,'fall'))return;msgSet('Oof. That was a long way down.',2);}
 else p.landDur=n===1?0.12:0.02;
 if(keys.up||keys.act)p.upLock=true;
 ground();}
function ground(){const p=P;if(p.st==='dead')return;const c=colOf(p.x),r=rowOf(p.y),t=tile(c,r);
 for(const it of LV.items){if(!it.taken&&it.c===c&&it.r===r&&'kvwnaJ'.includes(it.type))applyItem(it);}
 if(t.k==='~'&&t.shake===0)t.shake=0.001;
 if(t.k==='p'){if(t.press<=0)pressPlate(t.link);t.press=0.25;}
 if(t.k==='x'){if(t.press<=0&&LV.door&&LV.door.open<1&&!LV.door.opening){LV.door.opening=true;SFX.door();msgSet('Somewhere, a door rumbles open.');}t.press=0.25;}
 const key=c+','+r;
 if(t.k==='o'){if(p.lastPot!==key&&(p.st==='run'||p.st==='stop'||p.st==='land')&&Math.abs(p.x-(c*TW+16))<9){p.lastPot=key;
   if(hurt(1,'pothole')){setSt('stumble');p.vx=p.f*35;msgSet(THEME[LV.theme].haz+' '+K.TAP+' to step carefully past it.');}}}
 else p.lastPot=null;}
function pressPlate(link){const latch=LV.set&&LV.set.some(s=>s.type==='latch'&&s.gate===link);if(latch&&!(LV.latched&&LV.latched[link])){LV.latched=LV.latched||{};LV.latched[link]=true;const s=LV.set.find(s=>s.type==='latch'&&s.gate===link);msgSet(s.msg||'The gate is locked open now.',3);}
 for(const gt of LV.gates){if(gt.link!==link)continue;if(latch)gt.keep=true;if(gt.mode==='closed'||gt.mode==='closing'){gt.mode='opening';SFX.gate();}else if(gt.mode==='open')gt.t=0;}}
function air(dt){const p=P;p.vy=Math.min(p.vy+G*dt,520);
 const ad=(keys.right?1:0)-(keys.left?1:0);if(ad!==0&&(p.hop||Math.abs(p.vx)<50)){p.vx=approach(p.vx,ad*45,260*dt);}
 const nx=collideX(p.x,p.x+p.vx*dt,p.y);if(hitWall)p.vx=0;
 let ny=p.y+p.vy*dt;
 if(p.vy<0){const fr=rowOf(p.y);if(ny-BODY<fr*TH&&tile(colOf(nx),fr-1).k!=='.'){ny=fr*TH+BODY;p.vy=0;}}
 if(ny<p.apexY)p.apexY=ny;
 if(p.vy>0&&p.noGrab<=0&&tryGrab(p.y,ny,nx))return;
 if(p.vy>0){const rr=Math.floor((ny+FL)/TH)-1,S=surf(rr);if(p.y<=S+0.01&&ny>=S&&standable(colOf(nx),rr)){p.x=nx;p.y=S;landed(rr);return;}}
 p.x=nx;p.y=ny;
 {const lr=rowOf(p.y),lt=tile(colOf(p.x),lr);if(lt.k==='%'&&p.y>lr*TH+(lt.spike?50:40)){p.hp=0;SFX.land();die(lt.spike?'spikes':'liquid');return;}}
 if(p.y>LV.h*TH+200){p.hp=0;die('fall');}}
function startStep(dist){const p=P,c=colOf(p.x),r=rowOf(p.y),f=p.f;let tx=p.x+f*(dist||12);
 const nc=c+f;if(tile(nc,r).k==='#'){const lim=f>0?(c+1)*TW-HW-0.5:c*TW+HW+0.5;tx=f>0?Math.min(tx,lim):Math.max(tx,lim);}
 else if(!standable(nc,r)){const lim=f>0?(c+1)*TW-3:c*TW+3;tx=f>0?Math.min(tx,lim):Math.max(tx,lim);}
 for(const gt of LV.gates){if(gt.open<0.75&&gt.r===r){const gx=(gt.c+1)*TW-4;if(f>0&&p.x+HW<=gx+0.5)tx=Math.min(tx,gx-HW-0.5);if(f<0&&p.x-HW>=gx-0.5)tx=Math.max(tx,gx+HW+0.5);}}
 p.sx=p.x;p.tx=tx;setSt('step');}

function updatePlayer(dt){
 const p=P;p.t+=dt;if(p.inv>0)p.inv-=dt;if(p.noGrab>0)p.noGrab-=dt;
 const dir=(keys.right?1:0)-(keys.left?1:0);const jk=keys.up||keys.act;const sp=keys.act&&!p.upLock,upk=keys.up&&!p.upLock;
 if(p.sheathT>0)p.sheathT-=dt;
 if(pressed.w1)switchWeapon('knife');if(pressed.w2)switchWeapon('bat');if(pressed.w3)switchWeapon('whip');if(pressed.swap)cycleWeapon();
 if(canFightFrom(p.st)&&p.sheathT<=0&&supported()){const fo=nearestFoe(ENGAGE,true);if(fo){enterFight();}}
 p.blocking=false;
 switch(p.st){
  case 'fight':{if(!supported()){toAir(0);break;}ground();if(p.st!=='fight')break;
   const fo=nearestFoe(SIGHT,true);if(!fo){setSt('stand');break;}
   p.f=fo.x>=p.x?1:-1;p.blocking=keys.block;if(pressed.block)p.blockStart=T;
   if(pressed.down){p.sheathT=2.5;setSt('stand');msgSet('Weapon away. Run for it!',1.6);break;}
   if(sp){if(dir!==0){p.f=dir;standJump();}else jumpUp(true);break;}
   if(upk&&grabDir()){jumpUp(false);break;}
   if(!p.blocking&&pressed.atk){startAttack();break;}
   if(dir!==0&&!p.blocking){const nx=p.x+dir*48*dt;const r=rowOf(p.y);
    if(!(dir===p.f&&Math.abs(fo.x-nx)<(ET[fo.type].small?16:24))&&standable(colOf(nx+dir*4),r)){p.vx=dir*48;moveGround(dt);p.anim+=48*dt;}}
   break;}
  case 'attack':{p.vx=0;const w=WEAP[p.atkW],wind=w.wind*(p.combo===3?1.4:1);if(!p.struck&&p.t>=wind){p.struck=true;doStrike();}
   if(p.struck&&pressed.atk&&p.combo<3&&p.atkW!=='gun')p.queued=true;
   if(p.queued&&p.t>=wind+w.rec*0.4){startAttack(p.combo+1);break;}
   if(p.t<wind+w.rec)break;
   if(p.t>=w.wind+w.rec){if(!supported()){toAir(0);break;}if(nearestFoe(SIGHT,true))setSt('fight');else setSt('stand');}break;}
  case 'hit':p.vx=approach(p.vx,0,260*dt);if(!supported()){toAir(p.vx);break;}moveGround(dt);if(p.t>0.3){if(nearestFoe(SIGHT,true))setSt('fight');else setSt('stand');}break;
  case 'stand':{p.vx=0;if(!supported()){toAir(0);break;}ground();if(p.st!=='stand')break;
   if(pressed.atk){startAttack();break;}
   if(upk){if(atDoor()){toExit();break;}jumpUp(false);if(p.st!=='stand')break;}
   if(sp){if(dir!==0){p.f=dir;standJump();break;}jumpUp(true);break;}
   if(keys.down){if(tryEat())break;if(!climbDown())setSt('crouch');break;}
   if(dir===0)p.justTurned=false;
   if(dir!==0){if(dir!==p.f)setSt('turn');else if(!(p.justTurned&&p.t<0.12)){p.justTurned=false;setSt('go');p.sx=p.x;}}
   break;}
  case 'go':{if(!supported()){toAir(0);break;}
   if(pressed.atk){startAttack();break;}
   if(upk&&atDoor()){toExit();break;}
   if(sp){standJump();break;}
   if(dir!==p.f){startStep(Math.max(2,12-Math.abs(p.x-p.sx)));break;}
   const nx=p.x+p.f*60*dt;const r=rowOf(p.y);
   if(!standable(colOf(nx+p.f*3),r)&&tile(colOf(nx+p.f*3),r).k!=='#'){if(p.t>0.13){setSt('run');p.vx=p.f*80;p.pj=false;}break;}
   p.vx=p.f*60;moveGround(dt);if(hitWall){setSt('stand');break;}
   if(p.t>0.13){setSt('run');p.vx=p.f*80;p.pj=false;}
   break;}
  case 'turn':p.vx=0;if(p.t>0.06){p.f=-p.f;setSt('stand');p.justTurned=true;}break;
  case 'run':{if(!supported()){toAir(p.vx*0.6);break;}
   if(upk&&atDoor()){toExit();break;}
   if(pressed.atk){p.vx=0;startAttack();break;}
   if(sp&&!p.pj){p.pj=true;p.pjT=0;}
   if(p.pj){p.pjT+=dt;const e=edgeAhead();const ed=e===null?999:Math.abs(e-p.x);if(ed<7||ed>66||p.pjT>0.6){runJump();break;}}
   else if(dir!==p.f){setSt('stop');break;}
   p.vx=approach(p.vx,p.f*RUN,RUNACC*dt);moveGround(dt);if(p.st!=='run'){p.pj=false;break;}ground();break;}
  case 'stop':{if(!supported()){toAir(p.vx*0.6);break;}
   if(sp){standJump();break;}
   p.vx=approach(p.vx,0,1500*dt);moveGround(dt);ground();if(p.st!=='stop')break;
   if(p.vx===0){if(dir===-p.f){p.f=-p.f;setSt('run');p.vx=p.f*50;p.pj=false;}else setSt('stand');}
   else if(dir===p.f){setSt('run');}
   break;}
  case 'step':{const k=Math.min(1,p.t/0.2);p.x=p.sx+(p.tx-p.sx)*k;ground();if(p.st!=='step')break;if(k>=1)setSt('stand');break;}
  case 'crouch':p.vx=0;if(!supported()){toAir(0);break;}ground();if(p.st==='crouch'&&!keys.down&&p.t>0.1)setSt('stand');break;
  case 'land':p.vx=0;if(!supported()){toAir(0);break;}ground();if(p.st==='land'&&p.t>p.landDur){if(dir===p.f){setSt('run');p.vx=p.f*70;p.pj=false;}else setSt('stand');}break;
  case 'stumble':p.vx=approach(p.vx,0,120*dt);if(!supported()){toAir(p.vx);break;}moveGround(dt);ground();if(p.st==='stumble'&&p.t>0.45)setSt('stand');break;
  case 'eat':p.vx=0;if(p.t>0.5){applyItem(p.item);if(p.st==='eat')setSt('stand');}break;
  case 'jumpUp':if(p.t>0.13){if(standable(p.gc,p.gr))hangAt(p.gc,p.gr,p.gd);else toAir(0);}break;
  case 'air':air(dt);break;
  case 'hang':{if(!standable(p.hc,p.hr)){toAir(0);p.noGrab=0.3;break;}
   const lt=tile(p.hc,p.hr);if(lt.k==='~'&&lt.shake===0)lt.shake=0.001;
   if(jk&&p.t>0.12){p.cx0=p.x;p.cy0=p.y;setSt('climb');break;}
   if(pressed.down&&p.t>0.05){toAir(0);p.noGrab=0.3;break;}
   break;}
